name: Build x86_64

on:
  push:
    paths:
      - '_build/core.pyx'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cython
        run: pip install cython setuptools

      - name: Compile core_x86_64.so
        run: |
          cd _build
          python setup_core.py
          cd ..

      - name: Strip symbols
        run: |
          SO_FILE=$(find _build -name "core*.so" -type f | head -1)
          if [ -n "$SO_FILE" ]; then
            strip --strip-all "$SO_FILE"
          fi

      - name: Move and upload
        run: |
          SO_FILE=$(find _build -name "core*.so" -type f | head -1)
          if [ -n "$SO_FILE" ]; then
            mv "$SO_FILE" core_x86_64.so
            git config user.name "Z-DeployBot"
            git config user.email "deploy@zbot.local"
            git add core_x86_64.so
            git diff --cached --quiet || git commit -m "[skip ci] auto-build core_x86_64.so"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
